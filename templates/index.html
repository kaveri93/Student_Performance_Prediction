<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Performance Prediction</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Profile */
        .sidebar {
            width: 25%;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }
        .sidebar img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #74ebd5;
            margin-bottom: 15px;
            transition: transform 0.3s;
        }
        .sidebar img:hover {
            transform: scale(1.1);
        }
        .sidebar h2 {
            margin: 10px 0;
            font-size: 26px;
            color: #74ebd5;
        }
        .sidebar p {
            margin: 8px 0;
            font-size: 15px;
            color: #bdc3c7;
        }
        .skills {
            margin-top: 20px;
            text-align: left;
        }
        .skill {
            margin: 15px 0;
        }
        .skill-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .progress-bar {
            background: #34495e;
            border-radius: 20px;
            overflow: hidden;
            height: 14px;
        }
        .progress {
            height: 14px;
            border-radius: 20px;
            background: linear-gradient(90deg, #74ebd5, #4bb3a7);
            width: 0;
            animation: load 2s forwards;
        }
        @keyframes load {
            from { width: 0; }
        }
        .python { width: 90%; }
        .ml { width: 80%; }

        /* Main Content */
        .container {
            flex: 1;
            margin: 40px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 36px; /* Larger heading */
            margin-bottom: 30px;
        }

        /* Form Styling */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }
        .input-group i {
            position: absolute;
            left: 12px;
            top: 42px;
            color: #74ebd5;
            font-size: 18px;
        }
        input, select {
            padding: 14px 14px 14px 40px; /* space for icon */
            border: 2px solid #ccc;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            font-size: 18px; /* Larger input fields */
        }
        input:focus, select:focus {
            border-color: #74ebd5;
            box-shadow: 0 0 12px rgba(116,235,213,0.6);
            transform: scale(1.03);
        }
        button {
            grid-column: span 2;
            padding: 18px;
            background: #74ebd5;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #4bb3a7;
            color: #fff;
            transform: scale(1.05);
        }
        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }
    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar Profile -->
    <div class="sidebar">
        <img src="{{ url_for('static', filename='lakshmi kaveri image.jpeg') }}" alt="S. Lakshmi Kaveri">
        <h2>S. Lakshmi Kaveri</h2>
        <p>Email: <strong>sankathalalakshmikaveri93@gmail.com</strong></p>
        <div class="skills">
            <div class="skill">
                <div class="skill-name">Python</div>
                <div class="progress-bar"><div class="progress python"></div></div>
            </div>
            <div class="skill">
                <div class="skill-name">Machine Learning</div>
                <div class="progress-bar"><div class="progress ml"></div></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h1>🎓 Student Performance Predictor</h1>
        <form action="/predict" method="post">
            <div class="input-group">
                <label for="Hours_Studied">Hours Studied</label>
                <i class="fa-solid fa-book-open"></i>
                <input type="number" step="any" name="Hours_Studied" required>
            </div>
            <div class="input-group">
                <label for="Previous_Scores">Previous Scores</label>
                <i class="fa-solid fa-chart-line"></i>
                <input type="number" step="any" name="Previous_Scores" required>
            </div>
            <div class="input-group">
                <label for="Extracurricular_Activities">Extracurricular Activities</label>
                <i class="fa-solid fa-users"></i>
                <select name="Extracurricular_Activities" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="input-group">
                <label for="Sleep_Hours">Sleep Hours</label>
                <i class="fa-solid fa-moon"></i>
                <input type="number" step="any" name="Sleep_Hours" required>
            </div>
            <div class="input-group">
                <label for="Sample_Question_Papers_Practiced">Sample Question Papers Practiced</label>
                <i class="fa-solid fa-file-alt"></i>
                <input type="number" step="any" name="Sample_Question_Papers_Practiced" required>
            </div>
            <button type="submit">Predict Performance</button>
        </form>
        <div class="result">
            {{ prediction_text }}
        </div>
    </div>
</body>
</html>
